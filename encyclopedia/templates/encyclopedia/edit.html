{% extends "encyclopedia/layout.html" %}

{% block title %}Edit: {{ title }}{% endblock %}

{% block body %}
    <h1>Edit page: {{ title }}</h1>

    {% if error %}
        <div class="alert alert-danger">
            <strong>Error:</strong>{{ error }}
        </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="content">Content (Markdown):</label>
            <textarea class="form-control" id="content" name="content" rows="15" placeholder="Write oage content in Markdown format" required>
                {{ content }}
            </textarea>
            <small class="form-text text-muted">
                The title "<strong>{{ title }}</strong>" will be automatically added as a heading.
            </small>
        </div>

        <button type="submit" class="btn btn-primary"> Save Change</button>
        <a href="{% url 'entry' title=title %}" class="btn btn-secondary">Cancel</a>
    </form>
{% endblock %}
